# Rewind configuration — all tunables live here (CLAUDE.md rule 1.1.9).
# Initial values from CLAUDE.md section 1.9. Tune only on tuning/dev splits.
# "TBD" values are placeholders: code must refuse to run on them, never default them.

ingest:
  # step 1.1: max |container duration - filename duration|; also the max gap/overlap between clips of one
  # camera that still counts as one continuous session. Filename times are cut to whole seconds at both ends
  # (15 names say 299 s for 300.0-300.33 s of video). Observed on the 300 files: -0.77 .. +1.33 s.
  # Errors worth catching (truncated file, wrong fps, wrong file) are tens of seconds.
  max_name_duration_diff_s: 2.0
proxy:
  # step 1.2: browser playback copies (H.264 MP4, +faststart). Never used for indexing.
  max_height: 720              # RGB 1920x1080 -> 1280x720; smaller videos (IR 352x240) are not upscaled
  codec: libx264               # chosen over h264_nvenc: 35 MB vs 88 MB per 5-min clip at similar speed
  crf: 23
  preset: veryfast
  keyint_frames: 250           # x264 default. G340 test clip: 35.3 MB vs 64.5 MB at 60; decoding a full 250-frame
                               # GOP at 720p (worst-case seek) takes 0.10 s vs 0.07 s
  max_duration_diff_s: 1.0     # Done-when of step 1.2: proxy duration within 1 s of the original
  align_check_frames: 900      # per file: first N decoded frames of proxy and original are compared. Was 300 for
                               # the first full run (299 clips passed; value kept in each row's settings). Raised
                               # because 2018-03-11.17-20-00 G474 opens with 10 s of near-static thermal video:
                               # shift 0 vs +1 tied at 300 frames (0.1536 vs 0.1539), while shift 0 wins over
                               # 900 frames and over the whole clip (0.235 vs 0.184). Cost: 3.1 s -> 9.2 s per RGB clip
  align_check_width: 320       # as grayscale at this width
  align_max_offset: 3          # frame shifts tried; frame-difference correlation must peak at shift 0
annotations:
  # step 1.3 (rewind/ingest/annotations.py, docs/meva_notes.md "Annotation conventions")
  contrib_sources: [CMU-v2, UMD-IBM, IBM-person-vehicle, IBM-person-person]  # third-party labels, IR clips only
  # Contrib records of one type that overlap in time are one event if their boxes overlap this much (mean over shared
  # frames of the best actor-pair IoU). Applied within and across sources. On G474, 24 CMU/UMD record pairs overlap
  # in time; 18 have box IoU >= 0.3. The values are continuous around 0.3 (0.25..0.38), so 0.3 is a judgement call.
  # A time-only rule would merge two different vehicles (time overlap 0.56, box IoU 0). IR is recall-only (Gate 0.3).
  contrib_merge_min_box_iou: 0.3
  # A piece ending on the last frame of a clip and a same-type piece starting on frame 0 of the next clip of the same
  # camera (back to back within ingest.max_name_duration_diff_s) get one group_id if their boxes at the join overlap
  # this much. Type alone would link wrongly: ~1/3 of end-of-clip pieces have no overlapping box in the next clip.
  boundary_merge_min_box_iou: 0.5
splits:
  # step 2.1 (rewind/eval/splits.py, scripts/make_splits.py). Time blocks of all cameras -> tuning / dev / test.
  # Sessions are continuous footage (clips touching within ingest.max_name_duration_diff_s).
  seed: 21                       # fixed before the first run; never re-rolled to get a "nicer" split
  block_target_min: 30           # CLAUDE.md 1.10: ~30-min blocks; a session of L min gives max(1, round(L / 30)) blocks
  target_fraction: {tuning: 0.15, dev: 0.15, test: 0.70}   # of footage hours (camera-hours), CLAUDE.md 1.10
  max_fraction_diff: 0.05        # tuning and dev each within 15% +/- 5%. One block is 8-14% of the footage, so a
                                 # tighter band leaves few or no valid assignments
  # Every split needs (counted per activity, a cut activity once):
  min_activity_types: 25         # "a mix of activity types": 35 types occur, every block alone has 27-32
  min_vehicle_starts: 20         # RGB (Kitware); event-rule tuning (6.1) and vehicle_event queries need them
  min_vehicle_stops: 20
  min_ir_activities: 10          # labelled IR (third-party, recall only); IR queries and the RGB vs IR breakdown
  # Every RGB camera's scene must be in dev and test (Kitware activities per camera). Added after draw 1 (PROGRESS
  # 2.1): the indoor gym G330 has ~930-1,475 activities per 03-11 block but 2-19 per block on other dates, and draw 1
  # gave dev 23 G330 activities vs 4,669 in test. Dev decides the gates for test, so it must show the same scenes.
  min_activities_per_rgb_camera: 20
  camera_coverage_splits: [dev, test]
  max_blocks_enumerated: 12      # all 3^n assignments are checked: 10 blocks (56k) ~5-9 s; 12 (519k) ~1-2 min
  # An event within this many seconds of a block of another split may be visible there too (camera clocks are
  # accurate to about +/- 1 s each, so two cameras can disagree by up to 2 s). Flagged, not deleted.
  boundary_pad_s: 2.0
sampling:
  appearance_fps: 1
  max_gap_s: 10
  dedup_motion_pixel_thresh: TBD    # step 4.1, tuning split
motion:
  fps: 5
  downscale_width: 640
  min_box_area_px: TBD
detection:
  enabled: TBD                      # Gate 3.3
  model: TBD                        # yolov8n/s or yolox_s/m
  license: TBD                      # recorded for README
  fps: 5
  imgsz: 640
  conf_thresh: 0.3
  classes: [person, car, truck, bus, motorcycle, bicycle]
appearance:
  model: ViT-B-16
  pretrained: TBD                   # exact open_clip tag
  max_crops_per_frame: 4
  crop_source: detection_then_motion   # detection_then_motion | motion | none
  crop_pad_frac: 0.2
  min_crop_px: 32
  mean_center: true
action:
  enabled: TBD                      # Gate 5.1
  model: TBD
  frames_per_window: 8
  window_s: 4
  stride_s: 2
events:
  enabled: TBD                      # Gate 6.2
  tracker: bytetrack
  vehicle_classes: [car, truck, bus, motorcycle]
  stop_speed_px_per_s: TBD          # tuned on tuning split
  min_stopped_s: TBD
  min_moving_s: TBD
  intent_keywords:
    vehicle_stops: [stop, stops, stopped, stopping, park, parks, parked, parking, pulls over, halts]
    vehicle_starts: [start, starts, starting, drives off, pulls away, leaves, departs]
search:
  k_per_index: 200
  ef_search: 200                    # must be >= k
  fusion: zscore_weighted
  weights: {appearance: 1.0, action: TBD, events: TBD}   # tuned on tuning split
  merge_gap_s: 5
  max_clip_s: 60
  clip_rank: mean_top3
  context_s: 5
